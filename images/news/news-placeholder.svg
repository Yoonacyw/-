<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
    <title id="title">News 图片占位图</title>
    <desc id="description">用于尚未添加现场照片的学术动态卡片</desc>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#071b2f"/>
            <stop offset="1" stop-color="#123e67"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#176da7" stop-opacity=".35"/>
