name: 发布已人工确认的成果

on:
  workflow_dispatch:
    inputs:
      pdf_filename:
        description: "PDF 文件名（只有一个待发布文件时可留空）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: achievement-review-flow
  cancel-in-progress: false

jobs:
  publish-reviewed:
    name: 发布审核后的成果信息与 PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出网站仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-achievements.txt

      - name: 安装 PDF 识别依赖
        run: python -m pip install --requirement requirements-achievements.txt

      - name: 发布已人工确认的成果
        env:
          REVIEW_PDF_FILENAME: ${{ inputs.pdf_filename }}
        run: >-
          python tools/achievement_manager.py
          --publish-reviewed "$REVIEW_PDF_FILENAME"

      - name: 提交成果记录和附件
        shell: bash
        run: |
          git add -A -- incoming-achievements data/achievements.json files/achievements publications.html
          if git diff --cached --quiet; then
            echo "没有需要发布的成果变更。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布人工确认的成果 PDF"
          git pull --rebase origin main
          git push origin HEAD:main
